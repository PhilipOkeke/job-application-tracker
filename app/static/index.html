<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Track job applications, next actions, and outcomes." />
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">CAREER PIPELINE</p>
        <h1>Job Application Tracker</h1>
        <p>Keep every opportunity, follow-up, and outcome in one focused workspace.</p>
      </div>
      <a class="docs-link" href="/docs">API docs</a>
    </header>

    <main>
      <section class="metrics" aria-label="Application analytics">
        <article><span>Total</span><strong id="metric-total">0</strong></article>
        <article><span>Active</span><strong id="metric-active">0</strong></article>
        <article><span>Response rate</span><strong id="metric-rate">0%</strong></article>
      </section>

      <section class="workspace">
        <form id="application-form" class="panel">
          <div class="panel-heading">
            <div><p class="eyebrow">NEW OPPORTUNITY</p><h2>Add an application</h2></div>
          </div>
          <label>Company<input name="company" required maxlength="120" placeholder="Acme Inc." /></label>
          <label>Role<input name="role" required maxlength="160" placeholder="Backend Engineer" /></label>
          <div class="form-row">
            <label>Status
              <select name="status">
                <option value="saved">Saved</option><option value="applied">Applied</option>
                <option value="interview">Interview</option><option value="offer">Offer</option>
                <option value="rejected">Rejected</option>
              </select>
            </label>
            <label>Applied on<input name="applied_on" type="date" /></label>
          </div>
          <label>Location<input name="location" maxlength="160" placeholder="Toronto / Remote" /></label>
          <label>Next action<input name="next_action" maxlength="240" placeholder="Follow up Friday" /></label>
          <label>Notes<textarea name="notes" maxlength="4000" placeholder="Hiring manager, interview notes, or priorities"></textarea></label>
          <p id="form-message" role="status"></p>
          <button class="primary" type="submit">Save application</button>
        </form>

        <section class="panel applications-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">PIPELINE</p><h2>Your applications</h2></div>
            <div class="filters">
              <input id="search" type="search" placeholder="Search company or role" />
              <select id="status-filter" aria-label="Filter by status">
                <option value="">All statuses</option><option value="saved">Saved</option>
                <option value="applied">Applied</option><option value="interview">Interview</option>
                <option value="offer">Offer</option><option value="rejected">Rejected</option>
              </select>
            </div>
          </div>
          <div id="application-list" class="application-list"></div>
        </section>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
